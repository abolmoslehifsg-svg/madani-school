<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه مدیریت مدرسه پرتو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root{
  --p:#4f46e5;--p2:#6366f1;--c:#06b6d4;--bg:#f4f5fa;--tx:#111827;--mu:#6b7280;
  --bd:#e5e7eb;--ok:#059669;--bad:#dc2626;--warn:#d97706;--info:#2563eb;
  --card:#fff;--nav:#fff;--header:#fff;--input-bg:#fff;--soft:#f9fafb;
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 10px 30px rgba(0,0,0,.08);
  --grad:linear-gradient(135deg,var(--p),var(--c));
}
[data-theme="dark"]{
  --bg:#0f172a;--tx:#e2e8f0;--mu:#94a3b8;--bd:#334155;--card:#1e293b;
  --nav:#1e293b;--header:#1e293b;--input-bg:#0f172a;--soft:#0b1220;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);
  font-size:14px;line-height:1.7;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
a{color:inherit}
.mu{color:var(--mu)}
.fa-num{font-feature-settings:"ss02"}

/* ---------- Layout ---------- */
header{display:flex;justify-content:space-between;align-items:center;
  padding:10px 24px;background:var(--header);border-bottom:1px solid var(--bd);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-style:normal;font-weight:800;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px}
.wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 24px;
  max-width:1320px;margin:auto}
nav{background:var(--nav);border-radius:16px;padding:8px;align-self:start;
  position:sticky;top:76px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow-y:auto}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:10px;color:var(--tx);
  text-decoration:none;font-size:13.5px;transition:background .15s;position:relative}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--p);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,.25)}
nav a .badge{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;
  padding:1px 7px;border-radius:99px;font-weight:700}
nav a.on .badge{background:rgba(255,255,255,.25)}
nav hr{border:0;border-top:1px solid var(--bd);margin:8px 4px}

main{min-width:0}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
h2{font-size:15px;margin-bottom:12px;font-weight:700}
h3{font-size:14px;margin-bottom:8px;font-weight:700}
main>p{margin-bottom:14px}

/* ---------- Card ---------- */
.card{background:var(--card);border-radius:16px;padding:18px;margin-top:16px;
  box-shadow:var(--shadow);border:1px solid transparent}
.card.flat{background:var(--soft)}
.ov{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse}
th{color:var(--mu);font-weight:600;text-align:right;background:var(--soft);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
th,td{padding:10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}

/* ---------- Forms ---------- */
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-weight:600;font-size:13px}
label.inline{display:flex;align-items:center;gap:8px;font-weight:400}
input,select,textarea{padding:9px 11px;border:1px solid var(--bd);border-radius:10px;
  background:var(--input-bg);color:var(--tx);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.12);outline:0}
textarea{resize:vertical;font-family:inherit}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--p)}

/* ---------- Buttons ---------- */
.b{border:1px solid var(--bd);background:var(--card);border-radius:10px;
  padding:8px 14px;cursor:pointer;font-weight:600;color:var(--tx);
  transition:transform .08s,box-shadow .15s,background .15s;display:inline-flex;
  align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.b:hover{box-shadow:var(--shadow)}
.b:active{transform:scale(.97)}
.b.p{background:var(--grad);color:#fff;border:0;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.b.ok{background:var(--ok);color:#fff;border:0}
.b.d{color:var(--bad);background:#fee2e2;border:0;padding:5px 12px}
.b.e{color:var(--p);background:#eef2ff;border:0;padding:5px 12px}
.b.g{background:var(--soft);border:1px solid var(--bd)}
.b.on{background:var(--p);color:#fff;border-color:var(--p)}
.b.sm{padding:5px 10px;font-size:12px}
.b.xs{padding:3px 8px;font-size:11px;border-radius:8px}
.b.block{width:100%}
[data-theme="dark"] .b.d{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .b.e{background:#312e81;color:#a5b4fc}

/* ---------- Tags ---------- */
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;
  font-weight:600;background:var(--soft);border:1px solid var(--bd)}
.tag.ok{background:#d1fae5;color:var(--ok);border-color:transparent}
.tag.bad{background:#fee2e2;color:var(--bad);border-color:transparent}
.tag.warn{background:#fef3c7;color:var(--warn);border-color:transparent}
.tag.info{background:#dbeafe;color:var(--info);border-color:transparent}
.tag.p{background:#e0e7ff;color:var(--p);border-color:transparent}
[data-theme="dark"] .tag.ok{background:#064e3b;color:#6ee7b7}
[data-theme="dark"] .tag.bad{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .tag.warn{background:#78350f;color:#fcd34d}
[data-theme="dark"] .tag.info{background:#1e3a8a;color:#93c5fd}
[data-theme="dark"] .tag.p{background:#312e81;color:#c7d2fe}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px}
.stat{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--grad);opacity:.15}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.stat small{color:var(--mu);font-size:12px}
.stat.acc::before{background:var(--p)}
.stat.ok::before{background:var(--ok)}
.stat.bad::before{background:var(--bad)}
.stat.warn::before{background:var(--warn)}

/* ---------- Bars ---------- */
.bars{display:flex;gap:18px;align-items:flex-end;height:190px;padding-top:10px}
.bars div{flex:1;max-width:90px;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;gap:2px}
.bars i{width:100%;background:var(--grad);border-radius:8px 8px 0 0;min-height:3px;transition:height .4s}
.bars span{font-size:12px;color:var(--mu);text-align:center;line-height:1.3}

/* ---------- Announcements / list items ---------- */
.ann{padding:12px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ann:last-child{border-bottom:0}
.ann .body{flex:1;min-width:0}
.ann b{font-size:14px}
.ann p{color:var(--mu);font-size:13px;margin-top:2px}
.ann small{color:var(--mu);font-size:11.5px}

/* ---------- Row / helpers ---------- */
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.row.start{justify-content:flex-start}
.row.gap{gap:8px}
.stack{display:grid;gap:12px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.divider{border:0;border-top:1px solid var(--bd);margin:14px 0}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:12px 22px;border-radius:12px;background:var(--tx);color:#fff;display:none;
  z-index:999;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;
  opacity:0;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
#toast.ok{background:var(--ok)}
#toast.warn{background:var(--warn)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:var(--grad);padding:16px;position:relative}
.login::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%)}
.login form{background:#fff;border-radius:22px;padding:34px;width:min(420px,100%);
  display:grid;gap:14px;color:#111;position:relative;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.login input,.login select{background:#fff;color:#111;border-color:#e5e7eb}
.login h1{font-size:22px;text-align:center;margin-bottom:4px}
.login .logo{justify-content:center;margin-bottom:8px}
.login .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#f3f4f6;padding:4px;border-radius:12px}
.login .tabs button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-weight:600;font-size:12.5px;cursor:pointer;color:#374151;transition:background .15s,color .15s}
.login .tabs button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
  display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px);animation:fade .2s}
.modal{background:var(--card);border-radius:18px;padding:24px;width:min(640px,100%);
  max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .2s}
.modal.wide{width:min(860px,100%)}
.modal h2{margin-bottom:16px;font-size:17px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ---------- Pager ---------- */
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:36px 16px;color:var(--mu)}
.empty .ico{font-size:44px;margin-bottom:8px;opacity:.6}

/* ---------- Chips / draft bar ---------- */
.chk-group{display:flex;flex-wrap:wrap;gap:8px}
.chk-group label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;
  padding:6px 10px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;background:var(--card)}
.chk-group label:has(input:checked){background:#eef2ff;border-color:var(--p);color:var(--p);font-weight:600}
.draft-bar{background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;
  padding:12px 16px;margin-top:12px;display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:10px}
[data-theme="dark"] .draft-bar{background:#78350f;border-color:#d97706}

/* ---------- Theme btn ---------- */
.theme-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:16px}

/* ---------- Attendance bell selector ---------- */
.bells{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bells button{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);
  background:var(--card);cursor:pointer;font-weight:600;font-size:12.5px}
.bells button.on{background:var(--p);color:#fff;border-color:var(--p)}
.bells button.has{background:#eef2ff;border-color:var(--p);color:var(--p)}
.bells button.has.on{background:var(--p);color:#fff}

/* ---------- Summary box (attendance) ---------- */
.summary-box{background:var(--soft);border:1px dashed var(--bd);border-radius:12px;
  padding:14px 16px;line-height:2;font-size:13.5px}
.summary-box .lbl{color:var(--mu);font-weight:600;margin-inline-end:6px}
.summary-box .p{color:var(--ok);font-weight:600}
.summary-box .a{color:var(--bad);font-weight:600}
.summary-box .l{color:var(--warn);font-weight:600}

/* ---------- Report card ---------- */
.report-card{background:linear-gradient(135deg,#fff,#f8fafc);border-radius:18px;
  padding:24px;box-shadow:var(--shadow-lg);border:1px solid var(--bd);position:relative;overflow:hidden}
[data-theme="dark"] .report-card{background:linear-gradient(135deg,#1e293b,#0f172a)}
.report-card::before{content:"";position:absolute;top:-40px;left:-40px;width:160px;height:160px;
  border-radius:50%;background:var(--grad);opacity:.08}
.report-head{display:flex;justify-content:space-between;align-items:center;
  border-bottom:2px solid var(--p);padding-bottom:14px;margin-bottom:18px;position:relative;z-index:1}
.report-head .school{font-size:16px;font-weight:800}
.report-head .meta{font-size:12.5px;color:var(--mu);margin-top:4px}
.report-head .badge-rank{background:var(--grad);color:#fff;padding:8px 16px;border-radius:12px;
  font-weight:800;font-size:14px;text-align:center;box-shadow:0 6px 18px rgba(79,70,229,.3)}
.report-head .badge-rank small{display:block;font-weight:600;font-size:11px;opacity:.9}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.report-grid .cell{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.report-grid .cell b{display:block;font-size:22px;font-weight:800}
.report-grid .cell small{color:var(--mu);font-size:11.5px}
.report-table th{background:var(--p);color:#fff;text-transform:none;font-size:12.5px}
.report-table td{font-size:13.5px}
.report-table tbody tr:nth-child(even){background:var(--soft)}
.report-foot{margin-top:18px;padding-top:14px;border-top:1px dashed var(--bd);
  display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}
.report-sign{display:flex;gap:40px;margin-top:24px;font-size:12.5px;color:var(--mu)}
.report-sign div{text-align:center;border-top:1px solid var(--bd);padding-top:6px;flex:1}

/* ---------- Chat ---------- */
.chat-wrap{display:grid;grid-template-columns:240px 1fr;gap:14px;height:calc(100vh - 180px);min-height:480px}
.chat-list{background:var(--card);border-radius:14px;overflow-y:auto;box-shadow:var(--shadow)}
.chat-list .item{padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;gap:10px;align-items:center}
.chat-list .item:hover{background:var(--soft)}
.chat-list .item.on{background:#eef2ff}
.chat-list .item .nm{font-weight:600;font-size:13.5px}
.chat-list .item .ls{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-box{background:var(--card);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.msg{max-width:75%;padding:9px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;word-wrap:break-word}
.msg.me{align-self:flex-start;background:var(--p);color:#fff;border-bottom-right-radius:4px}
.msg.you{align-self:flex-end;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:10.5px;opacity:.7;margin-top:4px}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd);background:var(--card)}
.chat-input input{flex:1}

/* ---------- Online class ---------- */
.online-card{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  padding:16px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--card)}
.online-card .live{display:inline-flex;align-items:center;gap:6px;color:var(--bad);font-weight:700;font-size:12px}
.online-card .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- Quiz ---------- */
.quiz-q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.quiz-q .opts{display:grid;gap:8px;margin-top:10px}
.quiz-q .opts label{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--bd);
  border-radius:10px;cursor:pointer;font-weight:400;transition:background .15s,border-color .15s}
.quiz-q .opts label:hover{background:var(--soft)}
.quiz-q .opts label:has(input:checked){background:#eef2ff;border-color:var(--p);font-weight:600}

/* ---------- Print ---------- */
@media print{
  header,nav,.np,.pager,.theme-btn,.draft-bar,.b,button{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:12px}
  .card{box-shadow:none;border:0;padding:0;margin:0}
  .report-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
  .stats{display:none}
}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;padding:12px}
  nav{position:static;display:flex;overflow-x:auto;gap:6px;padding:8px;max-height:none}
  nav a{white-space:nowrap;padding:8px 12px}
  nav hr{display:none}
  header{padding:10px 12px}
  .who .np{display:none}
  .chat-wrap{grid-template-columns:1fr;height:auto}
  .chat-list{max-height:200px}
  .chat-box{height:60vh}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
/* =========================================================================
   سامانه مدیریت مدرسه پرتو — نسخه 6
   Server-ready  •  Realtime (WebSocket)  •  Modular
   ========================================================================= */

/* ---------- تنظیمات سرور (بعداً خودت مقدار بده) ---------- */
const API_BASE = window.API_BASE || '/api';        // مثلاً: 'https://api.school.ir/api'
const WS_URL   = window.WS_URL   || null;          // مثلاً: 'wss://api.school.ir/ws'
const K = 'parto_lms_v6';
const USE_SERVER = false;   // ← وقتی سرور آماده شد true کن

/* ---------- ثابت‌ها ---------- */
const BELLS = ['زنگ اول','زنگ دوم','زنگ سوم','زنگ چهارم','زنگ پنجم','زنگ ششم','زنگ هفتم'];
const ST = {p:['حاضر','ok'],a:['غایب','bad'],l:['تأخیر','warn'],e:['مرخصی','info']};
const ROLE = {admin:'مدیر',vice:'معاون',teacher:'معلم',parent:'ولی',student:'دانش‌آموز'};
const PERM = {
  admin  :['dash','news','students','classes','grades','att','card','hw','quiz','poll','disc','online','msg','chat','ann','fin','rep','users','acc','set'],
  vice   :['dash','news','students','classes','grades','att','card','hw','quiz','poll','disc','online','msg','chat','ann','rep','users','acc'],
  teacher:['dash','news','students','grades','att','card','hw','quiz','poll','disc','online','msg','chat','ann','rep','acc'],
  parent :['dash','news','att','card','hw','poll','disc','online','msg','chat','ann','fin','rep','acc'],
  student:['dash','news','att','card','hw','quiz','poll','online','msg','chat','ann','rep','acc']
};
const PAGES = [
  ['dash','📊','داشبورد'],
  ['news','📰','اخبار'],
  ['students','👥','دانش‌آموزان'],
  ['classes','🏫','کلاس‌ها'],

/* =========================================================================

   ========================================================================= */
function wsConnect() {
  if (!WS_URL || !me) return;
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      wsReady = true;
      ws.send(JSON.stringify({type:'auth', userId:me.id, role:me.role}));
    };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data) } catch { return }
      handleWsMessage(m);
    };
    ws.onclose = () => { wsReady = false; setTimeout(wsConnect, 5000); };
    ws.onerror = () => { wsReady = false; };
  } catch(err) { console.warn('WS error', err) }
}
function wsSend(obj) {
  if (wsReady && ws) { try { ws.send(JSON.stringify(obj)) } catch {} }
}
function handleWsMessage(m) {
  switch (m.type) {
    case 'chat':
      chatCache[m.from] = chatCache[m.from] || [];
      chatCache[m.from].push({from:m.from, text:m.text, ts:m.ts, me:false});
      if (chatPeer === m.from) render();
      else toast('پیام جدید از ' + (m.fromName||m.from), 'info');
      break;
    case 'notify':
      toast(m.text, m.kind || 'info');
      break;
    case 'online-start':
      db.online = db.online || [];
      db.online.unshift(m.data);
      if (page === 'online') render();
      toast('کلاس آنلاین آغاز شد: ' + m.data.title, 'ok');
      break;
    case 'refresh':
      if (m.col) reload();
      break;
    default: break;
  }
}

async function hp(p, s) {
  if (!crypto.subtle) {
    let h = 5381;
    for (const c of s + p) h = (h*33 ^ c.charCodeAt(0)) >>> 0;
    return 'x' + h;
  }
  const E = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', E.encode(p), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:E.encode(s), iterations:100000, hash:'SHA-256'},
    k, 256
  );
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function mkUser(username, name, role, pw, sid, classIds) {
  sid = sid || ''; classIds = classIds || [];
  const salt = uid() + uid();
  return {id:uid(), username, name, role, sid, classIds, salt, hash: await hp(pw, salt)};
}

function validNid(n) {
  n = en(n);
  if (!/^\d{10}$/.test(n) || /^(\d)\1{9}$/.test(n)) return false;
  let s = 0;
  for (let i=0; i<9; i++) s += (+n[i]) * (10 - i);
  const r = s % 11;
  return (r < 2 && +n[9] === r) || (r >= 2 && +n[9] === 11 - r);
}

function paginate(arr, key) {
  const total = Math.max(1, Math.ceil(arr.length / PER_PAGE));
  if (pg[key] > total) pg[key] = total;
  const start = (pg[key]-1) * PER_PAGE;
  return {slice: arr.slice(start, start+PER_PAGE), total, page: pg[key]};
}
function pagerHtml(key, total) {
  if (total <= 1) return '';
  let h = '<div class="pager np">';
  h += `<button class="b sm" data-a="pg" data-i="${key}" data-v="${pg[key]-1}" ${pg[key]<=1?'disabled':''}>قبلی</button>`;
  for (let i=1; i<=total; i++) {
    if (i===1 || i===total || Math.abs(i-pg[key])<=2)
      h += `<button class="b sm${i===pg[key]?' on':''}" data-a="pg" data-i="${key}" data-v="${i}">${i.toLocaleString('fa-IR')}</button>`;
    else if (Math.abs(i-pg[key])===3) h += '<span class="mu">…</span>';

  h += `<button class="b sm" data-a="pg" data-i="${key}" data-v="${pg[key]+1}" ${pg[key]>=total?'disabled':''}>بعدی</button></div>`;
  return h;
}

/* ---------- CSV / Excel ---------- */
function csvDownload(rows, filename) {
  const bom = '\uFEFF';
  const txt = bom + rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
  a.download = filename;
  a.click();
}
function xlsxDownload(rows, filename, sheetName) {
  if (typeof XLSX === 'undefined') return false;
  try {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
    XLSX.writeFile(wb, filename);
    return true;
  } catch(e) { console.warn(e); return false }
}

/* ---------- پارس CSV / XLSX ---------- */
function parseCSVText(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i=0; i<text.length; i++) {
    const c = text[i], n = text[i+1];
    if (inQ) {
      if (c === '"' && n === '"') { cur += '"'; i++ }
      else if (c === '"') inQ = false;
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c===','||c===';'||c==='\t') { row.push(cur); cur = '' }
      else if (c==='\n' || (c==='\r'&&n==='\n')) { if(c==='\r')i++; row.push(cur); rows.push(row); row=[]; cur='' }
      else if (c==='\r') { row.push(cur); rows.push(row); row=[]; cur='' }
      else cur += c;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row) }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function parseSheet(file) {
  return new Promise((resolve, reject) => {
    const name = (file.name||'').toLowerCase();
    const isCsv = /\.(csv|txt)$/i.test(name) || (file.type||'').includes('csv');
    const isXls = /\.xlsx?$/i.test(name) || (file.type||'').includes('sheet') || (file.type||'').includes('excel');

    function readCsv() {
      const r = new FileReader();
      r.onload = e => {
        try {
          const rows = parseCSVText(e.target.result||'');
          rows.length ? resolve(rows) : reject(new Error('فایل خالی است'));
        } catch(err) { reject(err) }
      };
      r.onerror = () => reject(new Error('خواندن فایل ناموفق بود'));
      r.readAsText(file, 'UTF-8');
    }

    if (isCsv || (!isXls && typeof XLSX === 'undefined')) return readCsv();
    if (typeof XLSX === 'undefined') return reject(new Error('برای Excel، کتابخانه لود نشده. از CSV استفاده کن.'));

    const r = new FileReader();
    r.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', codepage:65001, cellText:true, cellDates:true});
        const sh = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sh, {header:1, defval:'', raw:false});
        resolve(rows);
      } catch(err) { try { readCsv() } catch(e2) { reject(err) } }
    };
    r.onerror = () => reject(new Error('خواندن فایل ناموفق بود'));
    r.readAsArrayBuffer(file);
  });
}

  let s = en(String(v??'')).replace(/[^0-9]/g, '');
  if (s.length > 0 && s.length < 10) s = s.padStart(10, '0');

}

  const stat = {p:0,a:0,l:0,e:0};
  Object.keys(db.att||{}).forEach(d => {
    Object.keys(db.att[d]||{}).forEach(b => {
      const rec = db.att[d][b][sid];
      if (rec && stat[rec.status] !== undefined) stat[rec.status]++;

  const groups = {p:[], a:[], l:[], e:[]};

    const name = (db.students.find(s=>s.id===id)||{}).name || '—';
    if (groups[r.status]) groups[r.status].push({name, delay:r.delay||0});

  const parts = [];
  if (groups.p.length) parts.push(`<span class="p">${groups.p.map(x=>esc(x.name)).join('، ')} حاضر</span>`);
  if (groups.a.length) parts.push(`<span class="a">${groups.a.map(x=>esc(x.name)).join('، ')} غایب</span>`);
  if (groups.l.length) parts.push(`<span class="l">${groups.l.map(x=>esc(x.name)+(x.delay?` (${toFa(x.delay)} دقیقه)`:''))+' تأخیر'}</span>`);
  if (groups.e.length) parts.push(`${groups.e.map(x=>esc(x.name)).join('، ')} مرخصی`);
  return parts.join(' · ');
}

chat: function() {

  const peers = db.users.filter(u => u.id !== me.id).map(u=>({
    id:u.id, name:u.name, role:u.role,
    last: (chatCache[u.id]||[]).slice(-1)[0]

    <div class="item ${chatPeer===u.id?'on':''}" data-a="chatOpen" data-i="${u.id}">
      <div class="avatar" style="width:32px;height:32px;font-size:12px">${esc(u.name.slice(0,1))}</div>

  /* پیام‌ها */
  const msgs = (chatCache[chatPeer]||[]).map(m=>`
    <div class="msg ${m.from===me.id?'me':'you'}">

      <span class="t">${faDT(m.ts)}</span>

  const head = chatPeer
    ? `<div class="chat-head"><span>${esc((db.users.find(u=>u.id===chatPeer)||{}).name||'')}</span>

  return `<h1>گفتگوی آنلاین</h1>` +
    `<div class="chat-wrap">

},

/* =========================================================================
   کارنامه — ارتقا یافته
   ========================================================================= */
rep: function() {
  const S = mine();
  if (!S.length) return head('کارنامه') + card('', empty('دانش‌آموزی برای نمایش وجود ندارد.','📈'));

  const s = S.find(x => x.id === rs) || S[0];
  const gs = db.grades.filter(g => g.sid === s.id);
  const scores = gs.map(g => g.score);

  /* نمره به تفکیک درس */
  const bySubject = {};
  gs.forEach(g => { (bySubject[g.subject] = bySubject[g.subject] || []).push(g) });

  /* رتبه در کلاس */
  const classMates = db.students.filter(x => x.classId === s.classId);
  const rankList = classMates.map(m => {
    const ms = db.grades.filter(g=>g.sid===m.id).map(g=>g.score);
    return {id:m.id, avg: avg(ms)};
  }).filter(x => x.avg != null).sort((a,b)=>b.avg-a.avg);
  const myRank = rankList.findIndex(x => x.id === s.id) + 1;
  const classAvg = avg(rankList.map(x=>x.avg));

  /* حضور و غیاب */
  const att = attForStudent(s.id);
  const attTotal = att.p + att.a + att.l + att.e;
  const attRate = attTotal ? Math.round((att.p / attTotal) * 100) : 0;

  /* مالی */
  const due = PERM[me.role].includes('fin')
    ? db.fin.filter(f => f.sid === s.id && !f.paid).reduce((t,f)=>t+f.amount,0)
    : null;

  /* نمودار درسی */
  const subjBars = Object.keys(bySubject).map(k=>{
    const a = avg(bySubject[k].map(g=>g.score));
    return `<div><b>${f1(a)}</b><i style="height:${clamp(a*5,3,100)}%"></i><span>${esc(k)}</span></div>`;
  }).join('');

  /* جدول ریز نمرات هر درس */
  const subjRows = Object.keys(bySubject).map(k=>{
    const items = bySubject[k];
    const a = avg(items.map(g=>g.score));
    return `<tr>
      <td><b>${esc(k)}</b></td>
      <td>${toFa(items.length)}</td>
      <td>${items.map(g=>`<span class="tag" style="margin:1px">${esc(g.type)}: ${f1(g.score)}</span>`).join(' ')}</td>
      <td>${scoreTag(a)}</td>
    </tr>`;
  }).join('');

  /* جدول کامل نمرات */
  const allRows = gs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(g=>`<tr>
    <td>${faDate(g.date)}</td><td>${esc(g.subject)}</td><td>${esc(g.type)}</td><td>${scoreTag(g.score)}</td>
  </tr>`).join('');

  return head('کارنامه', `${esc(s.name)} · ${cname(s.classId)}`) +
    (S.length > 1
      ? card('', `<label style="max-width:260px" class="np">انتخاب دانش‌آموز
          <select onchange="A.rs(this.value)">${stOpts(s.id)}</select></label>`)
      : '') +

    /* کارنامه اصلی */
    `<div class="report-card" style="margin-top:16px">
      <div class="report-head">
        <div>
          <div class="school">${esc(db.school)}</div>
          <div class="meta">سال تحصیلی ${esc(db.year||'—')} · ${esc(s.name)} · ${cname(s.classId)}</div>
          <div class="meta">کد ملی: ${toFa(s.nid)}</div>
        </div>
        <div class="badge-rank">
          ${toFa(myRank)} از ${toFa(rankList.length)}
          <small>رتبه در کلاس</small>
        </div>
      </div>

      <div class="report-grid">
        <div class="cell"><b>${f1(avg(scores))}</b><small>معدل کل</small></div>
        <div class="cell"><b>${f1(classAvg)}</b><small>میانگین کلاس</small></div>
        <div class="cell"><b>${toFa(scores.filter(x=>x>=17).length)}</b><small>نمره ۱۷+</small></div>
        <div class="cell"><b>${toFa(scores.filter(x=>x<10).length)}</b><small>نمره زیر ۱۰</small></div>
        <div class="cell"><b>${toFa(att.p)}</b><small>حاضر</small></div>
        <div class="cell"><b>${toFa(att.a)}</b><small>غایب</small></div>
        <div class="cell"><b>${toFa(att.l)}</b><small>تأخیر</small></div>
        <div class="cell"><b>${toFa(attRate)}٪</b><small>درصد حضور</small></div>
      </div>

      <h3 style="margin-top:8px">ریز نمرات به تفکیک درس</h3>
      ${Object.keys(bySubject).length
        ? `<table class="report-table">
            <thead><tr><th>درس</th><th>تعداد آزمون</th><th>نمرات</th><th>میانگین</th></tr></thead>
            <tbody>${subjRows}</tbody>
          </table>`
        : empty('نمره‌ای ثبت نشده است.','📝')}

      <h3 style="margin-top:20px">تاریخچه نمرات</h3>
      ${gs.length
        ? `<table class="report-table">
            <thead><tr><th>تاریخ</th><th>درس</th><th>نوع</th><th>نمره</th></tr></thead>
            <tbody>${allRows}</tbody>
          </table>`
        : empty('تاریخچه‌ای وجود ندارد.')}

      ${due != null ? `<div style="margin-top:18px" class="row">
        <b>مانده بدهی: <span class="tag ${due?'warn':'ok'}">${due?money(due):'بدون بدهی'}</span></b>
      </div>` : ''}

      <div class="report-sign">
        <div>امضای معلم</div>
        <div>امضای مدیر</div>
        <div>امضای ولی</div>
      </div>
      <div class="report-foot">
        <span>تاریخ صدور: ${faDate(iso())}</span>
        <span>${esc(db.school)} — سامانه پرتو</span>
      </div>
    </div>` +

    /* نمودار درسی */
    card('نمودار میانگین هر درس',
      Object.keys(bySubject).length
        ? `<div class="bars" style="height:180px">${subjBars}</div>`
        : empty('داده‌ای برای نمودار نیست.')) +

    /* دکمه چاپ */
    `<div class="row np" style="margin-top:16px">
      <button class="b p" onclick="window.print()">🖨 چاپ کارنامه</button>
      <button class="b sm np" data-a="csvReport" data-i="${s.id}">خروجی CSV</button>
    </div>`;
},

importStudents: async function(file) {
  if (!file) return;
  try {
    const rows = await parseSheet(file);
    if (rows.length < 2) return toast('فایل خالی است یا فقط هدر دارد.', 'bad');
    let added = 0, skipped = 0; const reasons = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !String(r[0]||'').trim()) continue;
      const name = String(r[0]).trim();
      const nid = normNid(r[1]);
      const className = String(r[2]||'').trim();
      const parent = String(r[3]||'').trim();
      const phone = normPhone(r[4]);
      if (!name || !nid) { skipped++; reasons.push(`ردیف ${i+1}: نام یا کد ملی خالی`); continue }
      if (!validNid(nid)) { skipped++; reasons.push(`ردیف ${i+1}: کد ملی نامعتبر (${nid})`); continue }
      if (db.students.some(s => s.nid === nid)) { skipped++; reasons.push(`ردیف ${i+1}: کد ملی تکراری`); continue }
      let classId = findClassId(className);
      if (!classId && className) { classId = uid(); db.classes.push({id:classId, name:className, grade:'', room:''}) }
      if (!classId && db.classes.length) classId = db.classes[0].id;
      if (!classId) { skipped++; reasons.push(`ردیف ${i+1}: کلاسی در سامانه نیست`); continue }
      db.students.push({id:uid(), name, nid, classId, parent, phone});
      added++;
    }
    save(); render();
    let msg = added.toLocaleString('fa-IR') + ' دانش‌آموز اضافه شد';
    if (skipped) msg += ` · ${skipped.toLocaleString('fa-IR')} رد شد`;
    if (reasons.length && reasons.length <= 3) msg += ` (${reasons.slice(0,3).join('؛ ')})`;
    if (reasons.length) console.warn('رد شده‌ها:', reasons);
    toast(msg, added ? 'ok' : 'bad');
  } catch(err) { console.error(err); toast('خطا در خواندن فایل: ' + (err.message||'فرمت نامعتبر'), 'bad') }
},

chatSend: function(e) {
  e.preventDefault();

  if (!t || !chatPeer) return;
  chatCache[chatPeer] = chatCache[chatPeer] || [];
  chatCache[chatPeer].push({from:me.id, text:t, ts:Date.now(), me:true});
  e.target.reset();
  render();

  const f = fd(e);
  const options = [f.o1, f.o2, f.o3, f.o4].filter(Boolean);

  e.target.reset();
},
finishQuiz: function(qid) {
  closeModal(); render(); toast('آزمون ذخیره شد.', 'ok');
},
startQuiz: function(qid) {
  const q = (db.quizzes||[]).find(x=>x.id===qid);
  if (!q) return;
  quizSession = {quiz:q, answers:{}, start:Date.now(), idx:0};
  renderQuizSession();
},
renderQuizSession: function() {
  const s = quizSession;
  if (!s) return;
  const q = s.quiz;
  const html = `<h2>${esc(q.title)} — ${toFa(q.questions.length)} سوال</h2>
    <div id="quizBody">
      ${q.questions.map((qq, i) => `
        <div class="quiz-q">
          <b>سوال ${toFa(i+1)}: ${esc(qq.text)}</b>
          <div class="opts">
            ${qq.options.map((o, j) => `
              <label><input type="radio" name="q${i}" value="${j}" ${s.answers[i]===j?'checked':''}
                onchange="A.quizAns(${i}, ${j})"> ${esc(o)}</label>`).join('')}
          </div>
        </div>`).join('')}
    </div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="b" data-a="cancelQuiz">انصراف</button>
      <button class="b p" data-a="submitQuiz">ثبت پاسخ‌ها</button>
    </div>`;
  openModal(html, true);
},
quizAns: function(qi, oi) { if (quizSession) quizSession.answers[qi] = oi },
submitQuiz: function() {
  if (!quizSession) return;
  const s = quizSession, q = s.quiz;
  let correct = 0;
  q.questions.forEach((qq, i) => { if (s.answers[i] === qq.correct) correct++ });
  const total = q.questions.length;
  const score = total ? +(correct / total * 20).toFixed(2) : 0;
  q.attempts = q.attempts || {};
  q.attempts[me.id] = {score, total, correct, ts:Date.now()};
  quizSession = null;
  save(); closeModal(); render();
  toast(`نمره شما: ${f1(score)} از ۲۰ (${toFa(correct)} از ${toFa(total)})`, 'ok');
  if (USE_SERVER) api.post('/quizzes/'+q.id+'/submit', {answers:s.answers}).catch(()=>{});
},
cancelQuiz: function() {
  if (quizSession && !confirm('از آزمون خارج می‌شوید؟')) return;
  quizSession = null; closeModal(); render();
},

importTeachers: async function(file) {
  if (!file || !isAdmin()) return;
  try {
    const rows = await parseSheet(file);
    if (rows.length < 2) return toast('فایل خالی است.', 'bad');
    let added = 0, skipped = 0; const reasons = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !String(r[0]||'').trim()) continue;
      const name = String(r[0]).trim();
      const username = String(r[1]||'').trim();
      const pw = String(r[2]||'123456');
      const classesStr = String(r[3]||'');
      if (!name || !username || username.length < 3) { skipped++; reasons.push(`ردیف ${i+1}: نام/نام‌کاربری ناقص`); continue }
      if (db.users.some(u => u.username === username)) { skipped++; reasons.push(`ردیف ${i+1}: نام‌کاربری تکراری`); continue }
      const classIds = classesStr.split(/[,،]/).map(n => findClassId(n.trim())).filter(Boolean);
      if (!classIds.length) { skipped++; reasons.push(`ردیف ${i+1}: کلاس معتبر پیدا نشد`); continue }
      db.users.push(await mkUser(username, name, 'teacher', pw || '123456', '', classIds));
      added++;
    }
    save(); render();
    let msg = added.toLocaleString('fa-IR') + ' معلم اضافه شد';
    if (skipped) msg += ` · ${skipped.toLocaleString('fa-IR')} رد شد`;
    if (reasons.length && reasons.length <= 3) msg += ` (${reasons.slice(0,3).join('؛ ')})`;
    toast(msg, added ? 'ok' : 'bad');
  } catch(err) { console.error(err); toast('خطا در خواندن فایل: ' + (err.message||''), 'bad') }
},

saveEdit: function(e) {
  e.preventDefault();
  const f = fd(e), type = editTarget.type, id = editTarget.id;
  if (type === 'students') {
    const nid = en(f.nid);
    if (!validNid(nid)) return toast('کد ملی معتبر نیست.', 'bad');
    if (db.students.some(s => s.id !== id && s.nid === nid)) return toast('این کد ملی قبلاً ثبت شده است.', 'bad');
    Object.assign(db.students.find(s=>s.id===id), {name:f.name.trim(), nid, classId:f.classId, parent:f.parent.trim(), phone:en(f.phone)});
  } else if (type === 'classes') {
    Object.assign(db.classes.find(c=>c.id===id), {name:f.name.trim(), grade:f.grade.trim(), room:f.room.trim()});
  } else if (type === 'grades') {
    const sc = parseFloat(en(f.score).replace('٫','.'));
    if (!(sc >= 0 && sc <= 20)) return toast('نمره باید بین ۰ تا ۲۰ باشد.', 'bad');
    Object.assign(db.grades.find(g=>g.id===id), {sid:f.sid, subject:f.subject.trim(), type:f.type, score:sc});
  } else if (type === 'users') {
    const u = db.users.find(x=>x.id===id);
    if (f.role === 'admin' && !isAdmin() && u.role !== 'admin') return toast('فقط مدیر می‌تواند نقش مدیر بدهد.', 'bad');
    u.name = f.name.trim();
    u.role = f.role;
    u.sid = f.sid || '';
    u.classIds = f.role === 'teacher'
      ? $$('#modalBg input[name="classIds"]:checked').map(c => c.value)
      : [];
  }
  save(); closeModal(); render(); toast('ذخیره شد.', 'ok');
  if (USE_SERVER) api.update(type, id, f).catch(()=>{});
},

del: function(id, c) {
  if (!confirm('این مورد حذف شود؟')) return;
  if (c === 'classes' && db.students.some(s => s.classId === id))
    return toast('ابتدا دانش‌آموزان این کلاس را جابه‌جا یا حذف کنید.', 'bad');
  if (c === 'users') {
    const u = db.users.find(x=>x.id===id);
    if (u.role === 'admin' && !isAdmin()) return toast('فقط مدیر می‌تواند مدیر را حذف کند.', 'bad');
    if (u.role === 'admin' && db.users.filter(x=>x.role==='admin').length < 2)
      return toast('حداقل یک مدیر باید بماند.', 'bad');
  }
  if (c === 'students') {
    db.grades = db.grades.filter(g => g.sid !== id);
    db.fin = db.fin.filter(f => f.sid !== id);
    Object.keys(db.att||{}).forEach(d => {
      Object.keys(db.att[d]||{}).forEach(b => delete db.att[d][b][id]);
    });
    db.users = db.users.filter(u => u.sid !== id);
  }
  db[c] = db[c].filter(x => x.id !== id);
  save(); render(); toast('حذف شد.', 'ok');
  if (USE_SERVER) api.remove(c, id).catch(()=>{});
}
};

      console.warn('خطای اتصال به سرور:', err);
      toast('اتصال به سرور برقرار نشد. از حالت آفلاین استفاده می‌شود.', 'warn');
      USE_SERVER = false;
    }
  }

  /* حالت آفلاین / demo */
  if (!USE_SERVER) {
    const raw = localStorage.getItem(K);
    if (raw) {
      try {
        db = JSON.parse(raw);
        if (db.v < 6) {
          db.v = 6;
          db.year = db.year || '۱۴۰۵-۱۴۰۶';
          db.news = db.news || [];
          db.polls = db.polls || [];
          db.discipline = db.discipline || [];
          db.cardAtt = db.cardAtt || [];
          db.homework = db.homework || [];
          db.quizzes = db.quizzes || [];
          db.online = db.online || [];
          db.messages = db.messages || [];
          db.chats = db.chats || {};
        }
      } catch(e) {
        console.warn('اطلاعات ذخیره‌شده خراب است؛ بازنشانی می‌شود.');
        db = await seed();
      }
    } else {
      db = await seed();
    }
    save();
  }

  /* بازیابی کاربر لاگین‌شده */
  if (!me) {
    const id = sessionStorage.getItem('u') || localStorage.getItem('u');
    me = db.users.find(u => u.id === id) || null;
    if (me) wsConnect();
  }

  page = location.hash.slice(1) || 'dash';
  render();
})();

/* =========================================================================
   نزدیک‌شدن چت به بالا (mobile keyboard)
   ========================================================================= */
window.addEventListener('resize', () => {
  if (page === 'chat') {
    const el = $('#chatMsgs');
    if (el) el.scrollTop = el.scrollHeight;
  }
});
</script>
