<style>

}

  --bg:#0f172a;--tx:#e2e8f0;--mu:#94a3b8;--bd:#334155;--card:#1e293b;--nav:#1e293b;

*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.7;transition:background .2s,color .2s}

.logo i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--c));color:#fff;display:grid;place-items:center;font-style:normal}

input,select,textarea{padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--input-bg);color:var(--tx);width:100%}

.b.e{color:var(--p);background:#eef2ff;border:0;padding:4px 12px}

.b.ok{background:var(--ok);color:#fff;border:0}
.b.sm{padding:4px 10px;font-size:12px}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg)}

[data-theme="dark"] .tag.ok{background:#064e3b;color:#6ee7b7}
[data-theme="dark"] .tag.bad{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .tag.warn{background:#78350f;color:#fcd34d}
[data-theme="dark"] .b.d{background:#7f1d1d;color:#fca5a5}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px}

.stat b{display:block;font-size:26px}

.bars div{flex:1;max-width:90px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.bars i{width:100%;background:linear-gradient(var(--c),var(--p));border-radius:8px 8px 0 0;min-height:3px}
.bars span{font-size:12px;color:var(--mu);text-align:center}
.ann{padding:10px 0;border-bottom:1px solid var(--bd)}

#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}#toast.warn{background:var(--warn)}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--c));padding:16px}
.login form{background:#fff;border-radius:20px;padding:32px;width:min(400px,100%);display:grid;gap:14px;color:#111}
.login input,.login select{background:#fff;color:#111;border-color:#e5e7eb}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}

</style>

<body>

<script>

const $=s=>document.querySelector(s),K='parto_lms_v5';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=()=>new Date().toLocaleDateString('en-CA');
const fd=e=>Object.fromEntries(new FormData(e.target));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=n=>n==null?'—':(+n.toFixed(2)).toLocaleString('fa-IR');
const money=n=>n.toLocaleString('fa-IR')+' تومان';
const faDate=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('fa-IR')}catch{return d}};
const PAGES=[['dash','📊','داشبورد'],['students','👥','دانش‌آموزان'],['classes','🏫','کلاس‌ها'],['grades','📝','نمرات'],['att','✅','حضور و غیاب'],['ann','📢','اعلانات'],['fin','💰','امور مالی'],['rep','📈','کارنامه'],['users','👤','کاربران'],['acc','🔑','حساب من'],['set','⚙️','تنظیمات']];
const PERM={admin:PAGES.map(p=>p[0]),vice:['dash','students','classes','grades','att','ann','rep','users','acc'],teacher:['dash','students','grades','att','rep','acc'],parent:['dash','ann','fin','rep','acc'],student:['dash','ann','rep','acc']};
const ROLE={admin:'مدیر',vice:'معاون',teacher:'معلم',parent:'ولی',student:'دانش‌آموز'};
const ST={p:['حاضر','ok'],a:['غایب','bad'],l:['تأخیر','warn']};
const PER_PAGE=10;
let db,me=null,page='dash',gf='',ad=iso(),rs='',fails=0,lock=0,pg={students:1,grades:1,fin:1,users:1,att:1};
let modal=null,editTarget=null,attClass='',dark=localStorage.getItem('parto_dark')==='1';
let attDraft={}, gradeDraft=[];

async function hp(p,s){
  if(!crypto.subtle){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}
  const E=new TextEncoder(),k=await crypto.subtle.importKey('raw',E.encode(p),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:E.encode(s),iterations:100000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function mkUser(username,name,role,pw,sid,classIds){
  sid=sid||'';classIds=classIds||[];
  const salt=uid()+uid();
  return{id:uid(),username:username,name:name,role:role,sid:sid,classIds:classIds,salt:salt,hash:await hp(pw,salt)};
}
function validNid(n){
  n=en(n);if(!/^\d{10}$/.test(n)||/^(\d)\1{9}$/.test(n))return false;
  let s=0;for(let i=0;i<9;i++)s+=(+n[i])*(10-i);const r=s%11;return (r<2&&+n[9]===r)||(r>=2&&+n[9]===11-r);
}
function csvDownload(rows,filename){
  const bom='\uFEFF',txt=bom+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click();
}
function paginate(arr,key){
  const total=Math.max(1,Math.ceil(arr.length/PER_PAGE));
  if(pg[key]>total)pg[key]=total;
  const start=(pg[key]-1)*PER_PAGE;
  return{slice:arr.slice(start,start+PER_PAGE),total:total,page:pg[key]};
}
function pagerHtml(key,total){
  if(total<=1)return '';
  let h='<div class="pager np">';
  h+='<button class="b sm" data-a="pg" data-i="'+key+'" data-v="'+(pg[key]-1)+'" '+(pg[key]<=1?'disabled':'')+'>قبلی</button>';
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-pg[key])<=2)h+='<button class="b sm'+(i===pg[key]?' on':'')+'" data-a="pg" data-i="'+key+'" data-v="'+i+'">'+i.toLocaleString('fa-IR')+'</button>';
    else if(Math.abs(i-pg[key])===3)h+='<span class="mu">…</span>';
  }
  h+='<button class="b sm" data-a="pg" data-i="'+key+'" data-v="'+(pg[key]+1)+'" '+(pg[key]>=total?'disabled':'')+'>بعدی</button></div>';
  return h;
}
function empty(msg,ico){return '<div class="empty"><div class="ico">'+(ico||'📭')+'</div><p>'+msg+'</p></div>'}
function needsConfirm(){return me&&me.role==='teacher'}

async function seed(){
  const classes=[
    {id:'c1',name:'دهم ریاضی',grade:'دهم',room:'۱۰۱'},
    {id:'c2',name:'دهم تجربی',grade:'دهم',room:'۱۰۲'},
    {id:'c3',name:'دهم انسانی',grade:'دهم',room:'۱۰۳'},
    {id:'c4',name:'یازدهم ریاضی',grade:'یازدهم',room:'۲۰۱'}
  ];
  const students=[
    ['علی احمدی','0499370899','c1','حسن احمدی','09121111111'],
    ['زهرا رضایی','0499370902','c2','محمد رضایی','09122222222'],
    ['محمد کریمی','0499370910','c1','رضا کریمی','09123333333'],
    ['سارا محمدی','0499370929','c4','اکبر محمدی','09124444444'],
    ['رضا نوری','0499370937','c1','حسن نوری','09125555555'],
    ['مریم حسینی','0123456789','c3','علی حسینی','09126666666']
  ].map(function(arr,i){return{id:'s'+i,name:arr[0],nid:arr[1],classId:arr[2],parent:arr[3],phone:arr[4]}});
  const g=function(i,subject,score,type){return{id:uid(),sid:'s'+i,subject:subject,score:score,type:type,date:iso()}};
  return{v:5,school:'مدرسه پرتو',year:'۱۴۰۴-۱۴۰۵',classes:classes,students:students,att:{},ann:[],fin:[],
    grades:[g(0,'ریاضی',18.5,'میان‌ترم'),g(0,'فیزیک',15,'کوییز'),g(1,'زیست',17,'میان‌ترم'),g(2,'ریاضی',8.5,'میان‌ترم'),g(3,'ادبیات',19,'پایان‌ترم'),g(5,'تاریخ',16,'میان‌ترم')],
    users:[
      await mkUser('manager','مدیر مدرسه','admin','12345678'),
      await mkUser('Qazanfari','قاظفری (معاون)','vice','12345678'),
      await mkUser('teacher','خانم معلم','teacher','teacher','',['c1','c2'])
    ]};
}
const save=function(){localStorage.setItem(K,JSON.stringify(db))};
const toast=function(m,t){const x=$('#toast');x.textContent=m;x.className=t||'';x.style.display='block';clearTimeout(x._t);x._t=setTimeout(function(){x.style.display='none'},3200)};
const applyTheme=function(){document.documentElement.setAttribute('data-theme',dark?'dark':'');localStorage.setItem('parto_dark',dark?'1':'0')};

const scoped=function(){return me.role==='parent'||me.role==='student'};
const teacherScoped=function(){return me.role==='teacher'&&me.classIds&&me.classIds.length};
const mine=function(){
  if(scoped())return db.students.filter(function(s){return s.id===me.sid});
  if(teacherScoped())return db.students.filter(function(s){return me.classIds.indexOf(s.classId)>=0});

};
const myClasses=function(){return teacherScoped()?db.classes.filter(function(c){return me.classIds.indexOf(c.id)>=0}):db.classes};

const tbl=function(h,r,e,ico){return r.length?'<div class="ov"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+r.join('')+'</tbody></table></div>':empty(e||'موردی ثبت نشده است.',ico||'📭')};
const opts=function(a,sel){return a.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===sel?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')};

const V={
dash:function(){
  const S=mine(),ids=S.map(function(s){return s.id}),gs=db.grades.filter(function(g){return ids.indexOf(g.sid)>=0}),day=db.att[iso()]||{};
  const cls=myClasses().map(function(c){const sids=db.students.filter(function(s){return s.classId===c.id}).map(function(s){return s.id});return{n:c.name,a:avg(db.grades.filter(function(g){return sids.indexOf(g.sid)>=0}).map(function(g){return g.score}))}}).filter(function(x){return x.a!=null});
  const an=annList().slice(0,3);
  return head('داشبورد','خوش آمدید '+esc(me.name)+(db.year?' · سال تحصیلی '+esc(db.year):''))+
  '<div class="stats"><div class="stat"><b>'+S.length.toLocaleString('fa-IR')+'</b>دانش‌آموز</div>'+
  (scoped()?'':'<div class="stat"><b>'+myClasses().length.toLocaleString('fa-IR')+'</b>کلاس</div><div class="stat"><b>'+ids.filter(function(i){return day[i]==='p'}).length.toLocaleString('fa-IR')+'</b>حاضر امروز</div>')+
  '<div class="stat"><b>'+f1(avg(gs.map(function(g){return g.score})))+'</b>میانگین نمرات</div></div>'+
  (scoped()?'':card('میانگین نمرات هر کلاس',cls.length?'<div class="bars">'+cls.map(function(c){return '<div><b>'+f1(c.a)+'</b><i style="height:'+Math.min(100,c.a*5)+'%"></i><span>'+esc(c.n)+'</span></div>'}).join('')+'</div>':empty('هنوز نمره‌ای ثبت نشده است.','📊')))+
  card('آخرین اعلان‌ها',an.length?an.map(function(a){return '<div class="ann"><b>'+esc(a.title)+'</b><p>'+esc(a.body)+'</p></div>'}).join(''):empty('اعلانی وجود ندارد.','📢'));
},
students:function(){
  const all=mine();
  const p=paginate(all,'students');
  const rows=p.slice.map(function(s){return '<tr data-s="'+esc(s.name+s.nid+s.parent)+'"><td><b>'+esc(s.name)+'</b></td><td dir="ltr">'+esc(s.nid)+'</td><td>'+cname(s.classId)+'</td><td>'+esc(s.parent)+'</td><td dir="ltr">'+esc(s.phone)+'</td><td>'+(mgr()?editBtn('students',s.id)+' '+delBtn('students',s.id):'')+'</td></tr>'});

  card('فهرست ('+all.length.toLocaleString('fa-IR')+')','<div class="row" style="margin-bottom:12px"><input placeholder="جستجو بر اساس نام، کد ملی یا ولی…" oninput="A.find(this.value)" style="flex:1;min-width:180px"><button class="b sm np" data-a="csvStudents">دانلود پشتیبان (CSV/Excel)</button></div>'+tbl(['نام','کد ملی','کلاس','ولی','تلفن',''],rows,'دانش‌آموزی ثبت نشده است.','👥')+pagerHtml('students',p.total));

function parseCSVText(text){
  text=text.replace(/^\uFEFF/,'');
  var rows=[], row=[], cur='', inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){cur+='"';i++}
      else if(c==='"')inQ=false;
      else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','||c===';'||c==='\t'){row.push(cur);cur=''}
      else if(c==='\n'||(c==='\r'&&n==='\n')){if(c==='\r')i++;row.push(cur);rows.push(row);row=[];cur=''}
      else if(c==='\r'){row.push(cur);rows.push(row);row=[];cur=''}
      else cur+=c;
    }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!==''})});
}
function parseSheet(file){
  return new Promise(function(resolve,reject){
    var name=(file.name||'').toLowerCase();
    var isCsv=/\.csv$/i.test(name)||/\.txt$/i.test(name)||((file.type||'').indexOf('csv')>=0);
    var isXls=/\.xlsx?$/i.test(name)||((file.type||'').indexOf('sheet')>=0)||((file.type||'').indexOf('excel')>=0);

    function readAsCsv(){
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var rows=parseCSVText(e.target.result||'');
          if(!rows.length)reject(new Error('فایل خالی است'));
          else resolve(rows);
        }catch(err){reject(err)}
      };
      reader.onerror=function(){reject(new Error('خواندن فایل ناموفق بود'))};
      reader.readAsText(file,'UTF-8');
    }

    if(isCsv || (!isXls && typeof XLSX==='undefined')){
      readAsCsv();
      return;
    }

    if(typeof XLSX==='undefined'){
      reject(new Error('برای فایل Excel کتابخانه لود نشده. از CSV استفاده کنید: در اکسل Save As → CSV'));
      return;
    }

    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array',codepage:65001,cellText:true,cellDates:true});
        var sheet=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
        resolve(rows);
      }catch(err){
        // fallback: maybe mislabeled csv
        try{readAsCsv()}catch(e2){reject(err)}
      }
    };
    reader.onerror=function(){reject(new Error('خواندن فایل ناموفق بود'))};
    reader.readAsArrayBuffer(file);
  });
}
function normNid(v){
  var s=en(String(v==null?'':v)).replace(/[^0-9]/g,'');
  if(s.length>0&&s.length<10)s=s.padStart(10,'0');
  if(s.length>10&&s.indexOf('.')>=0){s=en(String(v)).replace(/[^0-9]/g,'');if(s.length<10)s=s.padStart(10,'0')}
  return s;
}
function normPhone(v){
  return en(String(v==null?'':v)).replace(/[^0-9]/g,'');
}
function findClassId(name){
  name=String(name||'').trim();
  const c=db.classes.find(function(x){return x.name===name||x.name.replace(/\s/g,'')===name.replace(/\s/g,'')});
  return c?c.id:null;
}

 importStudents:async function(file){
  if(!file)return;
  try{
    const rows=await parseSheet(file);
    if(rows.length<2)return toast('فایل خالی است یا فقط هدر دارد.','bad');
    let added=0,skipped=0,reasons=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];if(!r||!String(r[0]||'').trim())continue;
      const name=String(r[0]).trim(),nid=normNid(r[1]),className=String(r[2]||'').trim(),parent=String(r[3]||'').trim(),phone=normPhone(r[4]);
      if(!name||!nid){skipped++;reasons.push('ردیف '+(i+1)+': نام یا کد ملی خالی');continue}
      if(!validNid(nid)){skipped++;reasons.push('ردیف '+(i+1)+': کد ملی نامعتبر ('+nid+')');continue}
      if(db.students.some(function(s){return s.nid===nid})){skipped++;reasons.push('ردیف '+(i+1)+': کد ملی تکراری');continue}
      let classId=findClassId(className);
      if(!classId&&className){
        // auto-create class from excel name
        classId=uid();
        db.classes.push({id:classId,name:className,grade:'',room:''});
      }
      if(!classId&&db.classes.length)classId=db.classes[0].id;
      if(!classId){skipped++;reasons.push('ردیف '+(i+1)+': کلاسی در سامانه نیست');continue}
      db.students.push({id:uid(),name:name,nid:nid,classId:classId,parent:parent,phone:phone});
      added++;
    }
    save();render();
    var msg=added.toLocaleString('fa-IR')+' دانش‌آموز اضافه شد';
    if(skipped)msg+=' · '+skipped.toLocaleString('fa-IR')+' رد شد';

    if(reasons.length)console.warn('رد شده‌ها:',reasons);
    toast(msg,added?'ok':'bad');
  }catch(err){console.error(err);toast('خطا در خواندن فایل: '+(err.message||'فرمت نامعتبر'),'bad')}
