<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه مدیریت مدرسه پرتو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--c:#06b6d4;--bg:#f4f5fa;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ok:#059669;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.mu{color:var(--mu)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--c));color:#fff;display:grid;place-items:center;font-style:normal}
.who{display:flex;gap:8px;align-items:center}
.wrap{display:grid;grid-template-columns:210px 1fr;gap:20px;padding:20px 24px;max-width:1280px;margin:auto}
nav{background:#fff;border-radius:14px;padding:10px;align-self:start;position:sticky;top:76px}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:10px;color:var(--tx);text-decoration:none}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--p);color:#fff;font-weight:600}
h1{font-size:22px;font-weight:800}
h2{font-size:15px;margin-bottom:12px}
main>p{margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:18px;margin-top:16px}
.ov{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{color:var(--mu);font-weight:600;text-align:right;background:var(--bg)}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-weight:600;font-size:13px}
input,select,textarea{padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;width:100%}
.b{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.b.p{background:linear-gradient(135deg,var(--p),var(--c));color:#fff;border:0}
.b.d{color:var(--bad);background:#fee2e2;border:0;padding:4px 12px}
.b.on{background:var(--p);color:#fff;border-color:var(--p)}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg)}
.tag.ok{background:#d1fae5;color:var(--ok)}.tag.bad{background:#fee2e2;color:var(--bad)}.tag.warn{background:#fef3c7;color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px}
.stat{background:#fff;border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px}
.bars{display:flex;gap:18px;align-items:flex-end;height:190px;padding-top:10px}
.bars div{flex:1;max-width:90px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.bars i{width:100%;background:linear-gradient(var(--c),var(--p));border-radius:8px 8px 0 0;min-height:3px}
.bars span{font-size:12px;color:var(--mu);text-align:center}
.ann{padding:10px 0;border-bottom:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;background:var(--tx);color:#fff;display:none;z-index:9}
#toast.bad{background:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--c));padding:16px}
.login form{background:#fff;border-radius:20px;padding:32px;width:min(400px,100%);display:grid;gap:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:12px}nav{position:static;display:flex;overflow-x:auto}nav a{white-space:nowrap}header{padding:10px 12px}}
@media print{header,nav,.np{display:none}.wrap{display:block}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),K='parto_lms_v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=()=>new Date().toLocaleDateString('en-CA');
const fd=e=>Object.fromEntries(new FormData(e.target));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=n=>n==null?'—':(+n.toFixed(2)).toLocaleString('fa-IR');
const money=n=>n.toLocaleString('fa-IR')+' تومان';
const PAGES=[['dash','📊','داشبورد'],['students','👥','دانش‌آموزان'],['classes','🏫','کلاس‌ها'],['grades','📝','نمرات'],['att','✅','حضور و غیاب'],['ann','📢','اعلانات'],['fin','💰','امور مالی'],['rep','📈','کارنامه'],['users','👤','کاربران'],['set','⚙️','تنظیمات']];
const PERM={admin:PAGES.map(p=>p[0]),vice:['dash','students','classes','grades','att','ann','rep','users'],teacher:['dash','students','grades','att','rep'],parent:['dash','ann','fin','rep'],student:['dash','ann','rep']};
const ROLE={admin:'مدیر',vice:'معاون',teacher:'معلم',parent:'ولی',student:'دانش‌آموز'};
const ST={p:['حاضر','ok'],a:['غایب','bad'],l:['تأخیر','warn']};
let db,me=null,page='dash',gf='',ad=iso(),rs='',fails=0,lock=0;

async function hp(p,s){
  if(!crypto.subtle){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}
  const E=new TextEncoder(),k=await crypto.subtle.importKey('raw',E.encode(p),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:E.encode(s),iterations:100000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function mkUser(username,name,role,pw,sid=''){const salt=uid()+uid();return{id:uid(),username,name,role,sid,salt,hash:await hp(pw,salt)}}
async function seed(){
  const classes=[{id:'c1',name:'دهم ریاضی',grade:'دهم',room:'۱۰۱'},{id:'c2',name:'دهم تجربی',grade:'دهم',room:'۱۰۲'},{id:'c3',name:'یازدهم ریاضی',grade:'یازدهم',room:'۲۰۱'}];
  const students=[['علی احمدی','0012345678','c1','حسن احمدی','09121111111'],['زهرا رضایی','0022345678','c2','محمد رضایی','09122222222'],['محمد کریمی','0032345678','c1','رضا کریمی','09123333333'],['سارا محمدی','0042345678','c3','اکبر محمدی','09124444444'],['رضا نوری','0052345678','c1','حسن نوری','09125555555']].map(([name,nid,classId,parent,phone],i)=>({id:'s'+i,name,nid,classId,parent,phone}));
  const g=(i,subject,score,type)=>({id:uid(),sid:'s'+i,subject,score,type,date:iso()});
  return{school:'مدرسه پرتو',classes,students,att:{},ann:[],fin:[],
    grades:[g(0,'ریاضی',18.5,'میان‌ترم'),g(0,'فیزیک',15,'کوییز'),g(1,'زیست',17,'میان‌ترم'),g(2,'ریاضی',8.5,'میان‌ترم'),g(3,'ادبیات',19,'پایان‌ترم')],
    users:[await mkUser('sultan_bey','سلطان بیک (مدیر)','admin','sultan_bey'),await mkUser('vice','معاون مدرسه','vice','vice'),await mkUser('teacher','خانم معلم','teacher','teacher')]};
}
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const toast=(m,t='')=>{const x=$('#toast');x.textContent=m;x.className=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2800)};

const scoped=()=>me.role==='parent'||me.role==='student';
const mine=()=>scoped()?db.students.filter(s=>s.id===me.sid):db.students;
const sname=id=>esc((db.students.find(s=>s.id===id)||{}).name||'—');
const cname=id=>esc((db.classes.find(c=>c.id===id)||{}).name||'—');
const mgr=()=>['admin','vice'].includes(me.role);
const head=(t,s='')=>`<h1>${t}</h1>${s?`<p class="mu">${s}</p>`:''}`;
const card=(h,b)=>`<section class="card">${h?`<h2>${h}</h2>`:''}${b}</section>`;
const tbl=(h,r,e='موردی ثبت نشده است.')=>r.length?`<div class="ov"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`:`<p class="mu">${e}</p>`;
const opts=(a,sel)=>a.map(([v,t])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`).join('');
const stOpts=sel=>opts(mine().map(s=>[s.id,s.name]),sel);
const del=(c,i)=>`<button class="b d" data-a="del" data-i="${esc(i)}" data-v="${c}">حذف</button>`;
const scoreTag=n=>`<span class="tag ${n<10?'bad':n>=17?'ok':''}">${f1(n)}</span>`;

const V={
dash(){
  const S=mine(),ids=S.map(s=>s.id),gs=db.grades.filter(g=>ids.includes(g.sid)),day=db.att[iso()]||{};
  const cls=db.classes.map(c=>{const sids=db.students.filter(s=>s.classId===c.id).map(s=>s.id);return{n:c.name,a:avg(db.grades.filter(g=>sids.includes(g.sid)).map(g=>g.score))}}).filter(x=>x.a!=null);
  const an=annList().slice(0,3);
  return head('داشبورد','خوش آمدید '+esc(me.name))+
  `<div class="stats"><div class="stat"><b>${S.length.toLocaleString('fa-IR')}</b>دانش‌آموز</div>`+
  (scoped()?'':`<div class="stat"><b>${db.classes.length.toLocaleString('fa-IR')}</b>کلاس</div><div class="stat"><b>${ids.filter(i=>day[i]==='p').length.toLocaleString('fa-IR')}</b>حاضر امروز</div>`)+
  `<div class="stat"><b>${f1(avg(gs.map(g=>g.score)))}</b>میانگین نمرات</div></div>`+
  (scoped()?'':card('میانگین نمرات هر کلاس',cls.length?`<div class="bars">${cls.map(c=>`<div><b>${f1(c.a)}</b><i style="height:${c.a*5}%"></i><span>${esc(c.n)}</span></div>`).join('')}</div>`:'<p class="mu">هنوز نمره‌ای ثبت نشده است.</p>'))+
  card('آخرین اعلان‌ها',an.length?an.map(a=>`<div class="ann"><b>${esc(a.title)}</b><p>${esc(a.body)}</p></div>`).join(''):'<p class="mu">اعلانی وجود ندارد.</p>');
},
students(){
  const rows=db.students.map(s=>`<tr data-s="${esc(s.name+s.nid+s.parent)}"><td><b>${esc(s.name)}</b></td><td>${esc(s.nid)}</td><td>${cname(s.classId)}</td><td>${esc(s.parent)}</td><td dir="ltr">${esc(s.phone)}</td><td>${del('students',s.id)}</td></tr>`);
  return head('دانش‌آموزان')+card('افزودن دانش‌آموز',`<form class="fm" onsubmit="A.addStudent(event)"><label>نام و نام خانوادگی<input name="name" required></label><label>کد ملی<input name="nid" required pattern="[0-9۰-۹]{10}" title="۱۰ رقم" inputmode="numeric"></label><label>کلاس<select name="classId" required>${opts(db.classes.map(c=>[c.id,c.name]))}</select></label><label>نام ولی<input name="parent"></label><label>تلفن ولی<input name="phone" dir="ltr" pattern="09[0-9]{9}|۰۹[۰-۹]{9}" title="مثلاً 09123456789"></label><button class="b p">افزودن</button></form>`)+
  card(`فهرست (${db.students.length.toLocaleString('fa-IR')})`,`<input placeholder="جستجو بر اساس نام، کد ملی یا ولی…" oninput="A.find(this.value)" style="margin-bottom:12px">`+tbl(['نام','کد ملی','کلاس','ولی','تلفن',''],rows));
},
classes(){
  const rows=db.classes.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.grade)}</td><td>${esc(c.room)}</td><td>${db.students.filter(s=>s.classId===c.id).length.toLocaleString('fa-IR')}</td><td>${del('classes',c.id)}</td></tr>`);
  return head('کلاس‌ها')+card('افزودن کلاس',`<form class="fm" onsubmit="A.addClass(event)"><label>نام کلاس<input name="name" required></label><label>پایه<input name="grade"></label><label>شماره اتاق<input name="room"></label><button class="b p">افزودن</button></form>`)+card('',tbl(['نام','پایه','اتاق','دانش‌آموز',''],rows));
},
grades(){
  const rows=db.grades.filter(g=>!gf||g.sid===gf).map(g=>`<tr><td>${esc(g.date)}</td><td>${sname(g.sid)}</td><td>${esc(g.subject)}</td><td>${esc(g.type)}</td><td>${scoreTag(g.score)}</td><td>${del('grades',g.id)}</td></tr>`);
  return head('نمرات','نمره بین ۰ تا ۲۰ ثبت می‌شود؛ زیر ۱۰ قرمز و ۱۷ به بالا سبز است.')+card('ثبت نمره',`<form class="fm" onsubmit="A.addGrade(event)"><label>دانش‌آموز<select name="sid" required>${stOpts()}</select></label><label>درس<input name="subject" required></label><label>نوع آزمون<select name="type">${opts(['میان‌ترم','پایان‌ترم','کوییز','پروژه'].map(x=>[x,x]))}</select></label><label>نمره<input name="score" required inputmode="decimal"></label><button class="b p">ثبت نمره</button></form>`)+
  card('',`<label style="max-width:260px;margin-bottom:12px">فیلتر دانش‌آموز<select onchange="A.gf(this.value)"><option value="">همه</option>${stOpts(gf)}</select></label>`+tbl(['تاریخ','دانش‌آموز','درس','نوع','نمره',''],rows));
},
att(){
  const day=db.att[ad]||{};
  const cnt=k=>Object.values(day).filter(v=>v===k).length.toLocaleString('fa-IR');
  const rows=db.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${cname(s.classId)}</td><td>${Object.entries(ST).map(([k,[t]])=>`<button class="b${day[s.id]===k?' on':''}" data-a="mark" data-i="${esc(s.id)}" data-v="${k}">${t}</button>`).join(' ')}</td></tr>`);
  return head('حضور و غیاب')+card('',`<div class="row"><label>تاریخ<input type="date" value="${ad}" onchange="A.date(this.value)"></label><button class="b" data-a="allP">همه حاضر</button><span>حاضر: ${cnt('p')} · غایب: ${cnt('a')} · تأخیر: ${cnt('l')}</span></div>`)+card('',tbl(['دانش‌آموز','کلاس','وضعیت'],rows));
},
ann(){
  const list=annList().map(a=>`<div class="ann row"><div><b>${esc(a.title)}</b> <span class="tag">${esc({all:'همه',teacher:'معلمان',parent:'اولیا',student:'دانش‌آموزان'}[a.target])}</span><p>${esc(a.body)}</p><small class="mu">${esc(a.date)}</small></div>${mgr()?del('ann',a.id):''}</div>`).join('');
  return head('اعلانات')+(mgr()?card('انتشار اعلان',`<form class="fm" onsubmit="A.addAnn(event)"><label>عنوان<input name="title" required></label><label>مخاطب<select name="target">${opts([['all','همه'],['teacher','معلمان'],['parent','اولیا'],['student','دانش‌آموزان']])}</select></label><label style="grid-column:1/-1">متن<textarea name="body" rows="3" required></textarea></label><button class="b p">انتشار</button></form>`):'')+card('',list||'<p class="mu">اعلانی وجود ندارد.</p>');
},
fin(){
  const ids=mine().map(s=>s.id),items=db.fin.filter(f=>ids.includes(f.sid)),sum=p=>money(items.filter(f=>!!f.paid===p).reduce((t,f)=>t+f.amount,0));
  const rows=items.map(f=>`<tr><td>${sname(f.sid)}</td><td>${esc(f.type)}</td><td>${money(f.amount)}</td><td>${esc(f.due||'—')}</td><td><span class="tag ${f.paid?'ok':'warn'}">${f.paid?'پرداخت شده':'پرداخت نشده'}</span></td><td>${me.role==='admin'?(f.paid?'':`<button class="b" data-a="pay" data-i="${esc(f.id)}">ثبت پرداخت</button> `)+del('fin',f.id):''}</td></tr>`);
  return head('امور مالی')+`<div class="stats"><div class="stat"><b>${sum(true)}</b>پرداخت‌شده</div><div class="stat"><b>${sum(false)}</b>پرداخت‌نشده</div></div>`+
  (me.role==='admin'?card('ثبت هزینه',`<form class="fm" onsubmit="A.addFin(event)"><label>دانش‌آموز<select name="sid" required>${stOpts()}</select></label><label>مبلغ (تومان)<input name="amount" required inputmode="numeric"></label><label>نوع<select name="type">${opts(['شهریه','کتاب','اردو','سایر'].map(x=>[x,x]))}</select></label><label>سررسید<input type="date" name="due"></label><button class="b p">ثبت</button></form>`):'')+card('',tbl(['دانش‌آموز','نوع','مبلغ','سررسید','وضعیت',''],rows));
},
rep(){
  const S=mine();if(!S.length)return head('کارنامه')+card('','<p class="mu">دانش‌آموزی برای نمایش وجود ندارد.</p>');
  const s=S.find(x=>x.id===rs)||S[0],gs=db.grades.filter(g=>g.sid===s.id),sc=gs.map(g=>g.score),by={};
  gs.forEach(g=>(by[g.subject]??=[]).push(g.score));
  const n={p:0,a:0,l:0};Object.values(db.att).forEach(d=>d[s.id]&&n[d[s.id]]++);
  const due=PERM[me.role].includes('fin')?db.fin.filter(f=>f.sid===s.id&&!f.paid).reduce((t,f)=>t+f.amount,0):null;
  return head('کارنامه')+(S.length>1?card('',`<label style="max-width:260px" class="np">دانش‌آموز<select onchange="A.rs(this.value)">${stOpts(s.id)}</select></label>`):'')+
  card(esc(s.name)+' — '+cname(s.classId),`<div class="stats" style="margin-top:0"><div class="stat"><b>${f1(avg(sc))}</b>معدل کل</div><div class="stat"><b>${sc.filter(x=>x>=17).length.toLocaleString('fa-IR')}</b>نمره ۱۷ به بالا</div><div class="stat"><b>${sc.filter(x=>x<10).length.toLocaleString('fa-IR')}</b>نمره زیر ۱۰</div><div class="stat"><b>${n.a.toLocaleString('fa-IR')}</b>غیبت · ${n.l.toLocaleString('fa-IR')} تأخیر</div>${due?`<div class="stat"><b>${money(due)}</b>بدهی</div>`:''}</div>`)+
  card('میانگین هر درس',tbl(['درس','تعداد آزمون','میانگین'],Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.length.toLocaleString('fa-IR')}</td><td>${scoreTag(avg(v))}</td></tr>`),'نمره‌ای ثبت نشده است.'))+
  `<button class="b np" style="margin-top:16px" onclick="print()">چاپ کارنامه</button>`;
},
users(){
  const roles=Object.entries(ROLE).filter(([k])=>me.role==='admin'||k!=='admin');
  const rows=db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td dir="ltr">${esc(u.username)}</td><td><span class="tag">${ROLE[u.role]}</span></td><td>${u.sid?sname(u.sid):'—'}</td><td>${u.id===me.id?'':del('users',u.id)}</td></tr>`);
  return head('کاربران')+card('افزودن کاربر',`<form class="fm" onsubmit="A.addUser(event)"><label>نام کامل<input name="name" required></label><label>نام کاربری<input name="username" dir="ltr" required pattern="[A-Za-z0-9_]{3,}" title="حداقل ۳ حرف انگلیسی، عدد یا _"></label><label>رمز عبور<input name="pw" type="password" minlength="6" required></label><label>نقش<select name="role">${opts(roles)}</select></label><label>دانش‌آموز مرتبط (ولی/دانش‌آموز)<select name="sid"><option value="">—</option>${opts(db.students.map(s=>[s.id,s.name]))}</select></label><button class="b p">افزودن</button></form>`)+card('',tbl(['نام','نام کاربری','نقش','دانش‌آموز',''],rows));
},
set(){
  return head('تنظیمات')+card('مدرسه',`<form class="fm" onsubmit="A.school(event)"><label>نام مدرسه<input name="school" value="${esc(db.school)}" required></label><button class="b p">ذخیره</button></form>`)+
  card('پشتیبان‌گیری','<p class="mu" style="margin-bottom:12px">اطلاعات فقط در همین مرورگر ذخیره می‌شود؛ مرتب از آن فایل پشتیبان بگیرید.</p><div class="row" style="justify-content:flex-start"><button class="b" data-a="export">دانلود پشتیبان</button><label class="b" style="display:inline-block">بازیابی از فایل<input type="file" accept=".json" hidden onchange="A.import(this.files[0])"></label><button class="b d" data-a="reset">بازنشانی کامل</button></div>');
}};
const annList=()=>db.ann.filter(a=>mgr()||a.target==='all'||a.target===me.role).sort((x,y)=>y.id.localeCompare(x.id));

function render(){
  const app=$('#app');
  if(!me){app.innerHTML=`<div class="login"><form onsubmit="A.login(event)"><div class="logo"><i>پ</i>${esc(db.school)}</div><h1>ورود به سامانه</h1><label>نام کاربری<input name="username" dir="ltr" autocomplete="username" required autofocus></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label><button class="b p">ورود</button><p class="mu" style="font-size:12px">حساب‌های اولیه: sultan_bey، vice و teacher (رمز هرکدام مثل نام کاربری). بعد از ورود رمزها را عوض کنید.</p></form></div>`;return}
  if(!PERM[me.role].includes(page))page='dash';
  app.innerHTML=`<header><div class="logo"><i>پ</i>${esc(db.school)}</div><div class="who"><span class="mu np">${new Date().toLocaleDateString('fa-IR',{dateStyle:'full'})}</span><span class="tag">${ROLE[me.role]}</span><b>${esc(me.name)}</b><button class="b" data-a="chpw">تغییر رمز</button><button class="b" data-a="logout">خروج</button></div></header><div class="wrap"><nav>${PAGES.filter(p=>PERM[me.role].includes(p[0])).map(p=>`<a href="#${p[0]}" class="${p[0]===page?'on':''}">${p[1]} ${p[2]}</a>`).join('')}</nav><main>${V[page]()}</main></div>`;
}
const push=(c,o,m)=>{db[c].push({id:uid(),...o});save();render();toast(m)};
const A={
 async login(e){e.preventDefault();if(Date.now()<lock)return toast('چند بار اشتباه وارد شدید؛ ۳۰ ثانیه صبر کنید.','bad');
  const f=fd(e),u=db.users.find(x=>x.username===f.username.trim());
  if(u&&await hp(f.password,u.salt)===u.hash){fails=0;me=u;sessionStorage.setItem('u',u.id);page=location.hash.slice(1)||'dash';render()}
  else{if(++fails>=5){lock=Date.now()+3e4;fails=0}toast('نام کاربری یا رمز عبور اشتباه است.','bad')}},
 logout(){me=null;sessionStorage.removeItem('u');render()},
 async chpw(){const p=prompt('رمز جدید (حداقل ۶ نویسه):');if(!p)return;if(p.length<6)return toast('رمز باید حداقل ۶ نویسه باشد.','bad');me.salt=uid()+uid();me.hash=await hp(p,me.salt);save();toast('رمز عبور تغییر کرد.')},
 find(q){q=q.trim();document.querySelectorAll('tr[data-s]').forEach(r=>r.hidden=!r.dataset.s.includes(q))},
 addStudent(e){e.preventDefault();const f=fd(e),nid=en(f.nid);if(db.students.some(s=>s.nid===nid))return toast('این کد ملی قبلاً ثبت شده است.','bad');push('students',{name:f.name.trim(),nid,classId:f.classId,parent:f.parent.trim(),phone:en(f.phone)},'دانش‌آموز اضافه شد.')},
 addClass(e){e.preventDefault();const f=fd(e);push('classes',f,'کلاس اضافه شد.')},
 addGrade(e){e.preventDefault();const f=fd(e),sc=parseFloat(en(f.score).replace('٫','.'));if(!(sc>=0&&sc<=20))return toast('نمره باید بین ۰ تا ۲۰ باشد.','bad');push('grades',{sid:f.sid,subject:f.subject.trim(),type:f.type,score:sc,date:iso()},'نمره ثبت شد.')},
 gf(v){gf=v;render()},date(v){if(v){ad=v;render()}},rs(v){rs=v;render()},
 mark(i,v){(db.att[ad]??={})[i]=v;save();render()},
 allP(){db.att[ad]=Object.fromEntries(db.students.map(s=>[s.id,'p']));save();render()},
 addAnn(e){e.preventDefault();push('ann',{...fd(e),date:new Date().toLocaleDateString('fa-IR')},'اعلان منتشر شد.')},
 addFin(e){e.preventDefault();const f=fd(e),amt=parseInt(en(f.amount),10);if(!(amt>0))return toast('مبلغ را درست وارد کنید.','bad');push('fin',{sid:f.sid,amount:amt,type:f.type,due:f.due,paid:false},'هزینه ثبت شد.')},
 pay(i){db.fin.find(f=>f.id===i).paid=new Date().toISOString();save();render();toast('پرداخت ثبت شد.')},
 async addUser(e){e.preventDefault();const f=fd(e);if(db.users.some(u=>u.username===f.username))return toast('این نام کاربری قبلاً وجود دارد.','bad');
  if(['parent','student'].includes(f.role)&&!f.sid)return toast('برای ولی یا دانش‌آموز، دانش‌آموز مرتبط را انتخاب کنید.','bad');
  if(f.role==='admin'&&me.role!=='admin')return toast('فقط مدیر می‌تواند مدیر بسازد.','bad');
  db.users.push(await mkUser(f.username,f.name.trim(),f.role,f.pw,f.sid));save();render();toast('کاربر اضافه شد.')},
 school(e){e.preventDefault();db.school=fd(e).school.trim();save();render();toast('ذخیره شد.')},
 del(id,c){
  if(!confirm('این مورد حذف شود؟'))return;
  if(c==='classes'&&db.students.some(s=>s.classId===id))return toast('ابتدا دانش‌آموزان این کلاس را جابه‌جا یا حذف کنید.','bad');
  if(c==='users'){const u=db.users.find(x=>x.id===id);if(u.role==='admin'&&me.role!=='admin')return toast('فقط مدیر می‌تواند مدیر را حذف کند.','bad');if(u.role==='admin'&&db.users.filter(x=>x.role==='admin').length<2)return toast('حداقل یک مدیر باید بماند.','bad')}
  if(c==='students'){db.grades=db.grades.filter(g=>g.sid!==id);db.fin=db.fin.filter(f=>f.sid!==id);Object.values(db.att).forEach(d=>delete d[id]);db.users=db.users.filter(u=>u.sid!==id)}
  db[c]=db[c].filter(x=>x.id!==id);save();render();toast('حذف شد.')},
 export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='school_backup_'+iso()+'.json';a.click()},
 async import(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!['users','students','classes','grades'].every(k=>Array.isArray(d[k]))||!d.users.some(u=>u.role==='admin'))throw 0;if(!confirm('اطلاعات فعلی با این فایل جایگزین می‌شود. ادامه می‌دهید؟'))return;db=d;save();me=null;sessionStorage.clear();render();toast('بازیابی شد؛ دوباره وارد شوید.')}catch{toast('فایل پشتیبان معتبر نیست.','bad')}},
 reset(){if(confirm('همه اطلاعات پاک می‌شود. مطمئن هستید؟')){localStorage.removeItem(K);sessionStorage.clear();location.hash='';location.reload()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.i,b.dataset.v)});
addEventListener('hashchange',()=>{if(me){page=location.hash.slice(1)||'dash';render()}});
(async()=>{const raw=localStorage.getItem(K);db=raw?JSON.parse(raw):await seed();save();me=db.users.find(u=>u.id===sessionStorage.getItem('u'))||null;page=location.hash.slice(1)||'dash';render()})();
</script>
